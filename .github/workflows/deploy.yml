# mainへのpushで、テスト → jarビルド → コンテナイメージをECRへpush → ECS Express Modeへデプロイを行う。
# AWSへの認証はOIDCで一時的な認証情報を受け取る方式にし、長期のアクセスキーをGitHubに置かない。
# 構築手順は KasagiChat リポジトリの docs/deploy-aws.md を参照。
name: Deploy to ECS Express Mode

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# デプロイが同時に走るとサービス更新が衝突するため、1本ずつ順番に実行する。
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  JAVA_VERSION: "25"
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: kasagichat-api
  ECS_SERVICE: kasagichat-api
  # シークレットは SSM パラメータストアに置き、タスク起動時に ECS が取得する。
  SSM_PREFIX: /kasagichat/prod

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # @SpringBootTest が実DBへ接続して起動するため、テスト用のPostgreSQLを立てる。
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kasagichat
          POSTGRES_USER: kasagichat
          POSTGRES_PASSWORD: kasagichat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kasagichat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: debug
      POSTGRESQL_HOSTNAME: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: kasagichat
      POSTGRES_USER: kasagichat
      POSTGRES_PASSWORD: kasagichat
      # テストではOAuthとLLMへ実際には接続しないため、ダミー値で起動させる。
      GITHUB_CLIENT_ID: ci-dummy
      GITHUB_CLIENT_SECRET: ci-dummy
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
      APP_SECURITY_PUBLIC_URL: http://localhost:3000
      API_CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew test

  deploy:
    needs: test
    # workflow_dispatch でも main 以外のコードを本番へデプロイしない。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # OIDCトークンの発行に必要。
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v5

      - name: Build jar
        run: ./gradlew bootJar

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # ECRのタグは上書き禁止にしているため、同じコミットを再実行しても重ならない名前にする。
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA::7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      # サービスが無ければ作成し、あれば更新する。新しいタスクが正常になってから切り替わり、
      # 失敗した場合は旧バージョンへ自動で戻る。完了（または失敗）まで待ってから終わる。
      # 環境変数とシークレットは毎回ここから全て渡すため、コンソールで直接変更しないこと。
      - name: Deploy to ECS Express Mode
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE }}
          image: ${{ env.IMAGE }}
          execution-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecsInfrastructureRoleForExpressServices
          task-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/kasagichat-task-role
          container-port: 8080
          health-check-path: /actuator/health
          # 0.5 vCPU / 2GB。Spring Boot にはメモリ2GBを確保し、CPUは低負荷のため半分にして費用を抑える。
          cpu: 512
          memory: 2048
          min-task-count: 1
          max-task-count: 2
          environment-variables: |
            [
              {"name": "SPRING_PROFILES_ACTIVE", "value": "prod"},
              {"name": "AWS_REGION", "value": "${{ env.AWS_REGION }}"},
              {"name": "POSTGRESQL_HOSTNAME", "value": "${{ vars.POSTGRESQL_HOSTNAME }}"},
              {"name": "POSTGRES_PORT", "value": "5432"},
              {"name": "POSTGRES_DB", "value": "postgres"},
              {"name": "POSTGRES_USER", "value": "${{ vars.POSTGRES_USER }}"},
              {"name": "APP_SECURITY_PUBLIC_URL", "value": "${{ vars.APP_SECURITY_PUBLIC_URL }}"},
              {"name": "GITHUB_CLIENT_ID", "value": "${{ vars.OAUTH_GITHUB_CLIENT_ID }}"},
              {"name": "GOOGLE_CLIENT_ID", "value": "${{ vars.OAUTH_GOOGLE_CLIENT_ID }}"},
              {"name": "DEMO_LLM_MODEL", "value": "${{ vars.DEMO_LLM_MODEL }}"}
            ]
          secrets: |
            [
              {"name": "POSTGRES_PASSWORD", "valueFrom": "${{ env.SSM_PREFIX }}/POSTGRES_PASSWORD"},
              {"name": "GITHUB_CLIENT_SECRET", "valueFrom": "${{ env.SSM_PREFIX }}/GITHUB_CLIENT_SECRET"},
              {"name": "GOOGLE_CLIENT_SECRET", "valueFrom": "${{ env.SSM_PREFIX }}/GOOGLE_CLIENT_SECRET"},
              {"name": "API_CREDENTIAL_ENCRYPTION_KEY", "valueFrom": "${{ env.SSM_PREFIX }}/API_CREDENTIAL_ENCRYPTION_KEY"}
            ]

      - name: Verify health
        env:
          ENDPOINT: ${{ steps.deploy.outputs.endpoint }}
        run: |
          HOST="${ENDPOINT#https://}"
          HOST="${HOST%%/*}"
          if [ -z "$HOST" ]; then
            echo "::error::サービスのURLを取得できませんでした。ECSコンソールでサービスの状態を確認してください。"
            exit 1
          fi
          echo "API URL: https://${HOST}" >> "$GITHUB_STEP_SUMMARY"
          # 新規作成直後はDNSの反映に時間がかかるため、数回だけ再試行する。
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors \
            "https://${HOST}/actuator/health"
