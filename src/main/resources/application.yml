spring:
  application:
    name: KasagiChat

  profiles:
    # 指定漏れ時に開発用設定で起動しないよう、安全側の本番設定を使用する。
    default: prod

  # docker-compose.yml (.devcontainer) の app/db コンテナ環境変数と一致させています
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOSTNAME:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

  session:
    store-type: jdbc
    jdbc:
      table-name: SPRING_SESSION

  security:
    oauth2:
      client:
        registration:
          # 例: Google/GitHub 等でログインを実装する際に有効化
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
            redirect-uri: "${APP_SECURITY_PUBLIC_URL}/login/oauth2/code/google"
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user, user:email
            redirect-uri: "${APP_SECURITY_PUBLIC_URL}/login/oauth2/code/github"

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  security:
    frontend-url: ${APP_SECURITY_PUBLIC_URL:http://localhost:3000}
    pending-registration-ttl: ${PENDING_REGISTRATION_TTL:30m}
  usage:
    # LLM呼び出し1回あたりの概算コスト（USD）。利用状況の表示にのみ使う。
    estimated-cost-per-call-usd: ${USAGE_ESTIMATED_COST_PER_CALL_USD:0.002}