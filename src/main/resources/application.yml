spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kasagichat}
    username: ${DB_USERNAME:kasagichat}
    password: ${DB_PASSWORD:kasagichat}
  jpa:
    # 実験用の簡易設定。本実装ではFlyway等のマイグレーション管理に置き換える
    hibernate:
      ddl-auto: update
    open-in-view: false
  session:
    # セッションをPostgreSQL(spring_sessionテーブル)に保存。
    # バックエンド再起動・本番のデプロイでユーザーがログアウトされない
    jdbc:
      initialize-schema: always # テーブル自動作成(実験用。本実装はFlywayに移す)
    # サーバ側セッションの寿命 = 最後の操作から14日
    timeout: 14d
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-client-secret}
            scope: read:user
            # 同一オリジン構成: コールバックはNext.js(3000)経由でSpringに届く
            redirect-uri: "${app.public-url}/api/login/oauth2/code/{registrationId}"
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope: openid,profile
            redirect-uri: "${app.public-url}/api/login/oauth2/code/{registrationId}"

app:
  # ブラウザから見えるこのアプリの公開URL。プロキシ越しではSpringが自分のURLを
  # backend:8080 と誤認するため、ブラウザへ返すリダイレクト先はすべてここから組み立てる
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  jwt:
    # HS256の署名鍵(32バイト以上必須)。本番では必ず環境変数JWT_SECRETで上書きする
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    # アクセストークンは短命(漏れても被害時間を限定)、リフレッシュは長命(DBで失効管理)
    access-token-ttl: 15m
    refresh-token-ttl: 30d

server:
  servlet:
    session:
      cookie:
        # HttpOnly: JSからセッションIDを読めなくする(XSS対策)
        http-only: true
        # Lax: 外部サイトからのPOSTにCookieが乗らない(CSRF対策の一層目)
        same-site: lax
        # Cookieを永続化(ブラウザを閉じても残す)。サーバ側timeoutと同じ14日
        max-age: 14d

management:
  endpoints:
    web:
      exposure:
        include: health
