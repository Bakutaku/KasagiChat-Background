spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  session:
    jdbc:
      initialize-schema: always

server:
  servlet:
    session:
      cookie:
        # localhostのHTTP接続でもセッションCookieを利用できるようにする。
        secure: false

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    '[org.springframework.security]': INFO
    '[org.hibernate.SQL]': DEBUG

app:
  llm:
    demo:
      provider: ${DEMO_LLM_PROVIDER:DEMO}
      base-url: ${DEMO_LLM_BASE_URL:http://localhost:1234/v1}
      model: ${DEMO_LLM_MODEL:google/gemma-4-e4b}
      api-key: ${DEMO_LLM_API_KEY:}