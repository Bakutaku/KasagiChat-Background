spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  session:
    jdbc:
      initialize-schema: always

server:
  servlet:
    session:
      cookie:
        # localhostのHTTP接続でもセッションCookieを利用できるようにする。
        secure: false

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
